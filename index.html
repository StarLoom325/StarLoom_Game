<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarLoom_Game - در حال بارگذاری...</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#0b0e1a 0%,#1a1f30 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;color:#f0f4ff}

        /* ===== شفق پس‌زمینه ===== */
        .aurora{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;overflow:hidden;pointer-events:none}
        .aurora::before,.aurora::after{content:'';position:absolute;width:200%;height:200%;top:-50%;left:-50%;background:radial-gradient(ellipse at 30% 50%,rgba(241,196,15,0.05) 0%,transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(231,76,60,0.04) 0%,transparent 50%),radial-gradient(ellipse at 50% 20%,rgba(46,204,113,0.03) 0%,transparent 50%);animation:auroraFloat 20s ease-in-out infinite alternate}
        .aurora::after{animation-delay:-10s;background:radial-gradient(ellipse at 60% 40%,rgba(52,152,219,0.04) 0%,transparent 50%),radial-gradient(ellipse at 20% 70%,rgba(155,89,182,0.03) 0%,transparent 50%)}
        @keyframes auroraFloat{0%{transform:translate(0,0) scale(1)}33%{transform:translate(5%,-5%) scale(1.02)}66%{transform:translate(-5%,5%) scale(0.98)}100%{transform:translate(3%,-3%) scale(1.01)}}

        /* ===== کانتینر اصلی ===== */
        .loading-container{text-align:center;padding:20px;animation:fadeIn 1s ease;max-width:500px;width:90%}
        @keyframes fadeIn{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}

        /* ===== لوگو ===== */
        .logo-wrapper{position:relative;margin-bottom:20px;display:inline-block}
        .stars-orbit{position:absolute;top:50%;left:50%;width:200px;height:200px;transform:translate(-50%,-50%);pointer-events:none}
        .stars-orbit span{position:absolute;font-size:1.2rem;animation:orbit 4s linear infinite}
        .stars-orbit span:nth-child(1){top:0;left:50%;animation-delay:0s}
        .stars-orbit span:nth-child(2){top:50%;left:100%;animation-delay:-1s}
        .stars-orbit span:nth-child(3){top:100%;left:50%;animation-delay:-2s}
        .stars-orbit span:nth-child(4){top:50%;left:0;animation-delay:-3s}
        @keyframes orbit{0%{transform:rotate(0deg) translateX(0) scale(1);opacity:1}50%{transform:rotate(180deg) translateX(20px) scale(1.2);opacity:0.7}100%{transform:rotate(360deg) translateX(0) scale(1);opacity:1}}

        .logo{font-size:3.5rem;font-weight:900;background:linear-gradient(135deg,#f9d976,#f39c12,#f1c40f);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 60px rgba(243,156,18,0.3);letter-spacing:2px;animation:logoPulse 2s ease-in-out infinite alternate}
        @keyframes logoPulse{0%{filter:brightness(1) drop-shadow(0 0 20px rgba(243,156,18,0.2))}100%{filter:brightness(1.2) drop-shadow(0 0 40px rgba(243,156,18,0.4))}}
        .logo span{color:#b9c7e6;background:none;-webkit-background-clip:unset;background-clip:unset;font-weight:300;font-size:2rem}

        .logo-sub{color:#b9c7e6;font-size:1rem;font-weight:300;margin-bottom:40px;letter-spacing:6px;opacity:0.7;animation:fadeInOut 2s ease-in-out infinite alternate}
        @keyframes fadeInOut{0%{opacity:0.4}100%{opacity:0.9}}

        /* ===== نوار بارگذاری ===== */
        .loader-wrapper{width:100%;max-width:400px;margin:0 auto}
        .loader-track{width:100%;height:8px;background:rgba(255,255,255,0.05);border-radius:10px;overflow:hidden;border:1px solid rgba(255,215,0,0.1);box-shadow:inset 0 0 10px rgba(0,0,0,0.5)}
        .loader-bar{height:100%;width:0%;background:linear-gradient(90deg,#f1c40f,#f39c12,#e67e22,#f1c40f);background-size:200% 100%;border-radius:10px;transition:width 0.3s ease;box-shadow:0 0 30px rgba(241,196,15,0.5);animation:barShine 2s linear infinite}
        @keyframes barShine{0%{background-position:0% 50%}100%{background-position:200% 50%}}

        .loader-text{color:#7a8bb0;font-size:0.9rem;margin-top:18px;font-weight:300;letter-spacing:1px}
        .loader-percent{color:#f1c40f;font-weight:700;font-size:1.3rem;display:inline-block;min-width:50px;text-align:center}

        /* ===== نقاط متحرک ===== */
        .dots{display:inline-block;margin-right:5px}
        .dots span{display:inline-block;animation:dotBounce 1.4s ease-in-out infinite;font-size:1.5rem;color:#f1c40f;line-height:1}
        .dots span:nth-child(2){animation-delay:0.2s}
        .dots span:nth-child(3){animation-delay:0.4s}
        @keyframes dotBounce{0%,80%,100%{transform:scale(0.5);opacity:0.3}40%{transform:scale(1.3);opacity:1}}

        /* ===== وضعیت ===== */
        .status-text{color:#7a8bb0;font-size:0.85rem;margin-top:10px;min-height:22px;transition:opacity 0.3s}
        .status-icon{display:inline-block;margin-left:5px}

        /* ===== کارت‌های در حال بارگذاری ===== */
        .loading-cards{display:flex;justify-content:center;gap:15px;margin-top:40px;flex-wrap:wrap}
        .loading-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,215,0,0.1);border-radius:15px;padding:12px 18px;display:flex;align-items:center;gap:8px;font-size:0.85rem;color:#a0b5d9;animation:cardFade 2s ease-in-out infinite;opacity:0.3}
        .loading-card:nth-child(1){animation-delay:0s}
        .loading-card:nth-child(2){animation-delay:0.3s}
        .loading-card:nth-child(3){animation-delay:0.6s}
        .loading-card:nth-child(4){animation-delay:0.9s}
        .loading-card .card-icon{font-size:1.3rem}
        @keyframes cardFade{0%,100%{opacity:0.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}

        /* ===== نسخه ===== */
        .version{position:fixed;bottom:20px;right:25px;color:#4a5575;font-size:0.7rem;letter-spacing:1px;opacity:0.5}

        /* ===== واکنش‌گرا ===== */
        @media(max-width:500px){
            .logo{font-size:2.5rem}
            .logo span{font-size:1.4rem}
            .logo-sub{font-size:0.85rem;letter-spacing:4px}
            .stars-orbit{width:140px;height:140px}
            .loader-wrapper{max-width:280px}
            .loading-card{font-size:0.75rem;padding:8px 12px}
            .loading-card .card-icon{font-size:1rem}
        }
    </style>
</head>
<body>

    <!-- شفق پس‌زمینه -->
    <div class="aurora"></div>

    <!-- کانتینر لودینگ -->
    <div class="loading-container">
        <!-- لوگو با ستاره‌های چرخان -->
        <div class="logo-wrapper">
            <div class="stars-orbit">
                <span>✦</span>
                <span>✧</span>
                <span>✦</span>
                <span>✧</span>
            </div>
            <div class="logo">StarLoom<span>_Game</span></div>
        </div>

        <div class="logo-sub">✦ در حال بارگذاری ✦</div>

        <!-- نوار بارگذاری -->
        <div class="loader-wrapper">
            <div class="loader-track">
                <div class="loader-bar" id="loaderBar"></div>
            </div>
            <div class="loader-text">
                <span class="loader-percent" id="loaderPercent">0</span>%
                <span class="dots">
                    <span>.</span><span>.</span><span>.</span>
                </span>
                <div class="status-text" id="statusText">
                    <span class="status-icon">⚙️</span>
                    آماده‌سازی...
                </div>
            </div>
        </div>

        <!-- کارت‌های در حال بارگذاری -->
        <div class="loading-cards">
            <div class="loading-card">
                <span class="card-icon">🐍</span>
                <span>مار و پله</span>
            </div>
            <div class="loading-card">
                <span class="card-icon">🏎️</span>
                <span>مسابقه سرعت</span>
            </div>
            <div class="loading-card">
                <span class="card-icon">💣</span>
                <span>بوم بوم</span>
            </div>
            <div class="loading-card">
                <span class="card-icon">⛏️</span>
                <span>ماینکرفت</span>
            </div>
        </div>
    </div>

    <div class="version">v2.0</div>

    <script>
        (function(){
            var progress = 0;
            var bar = document.getElementById('loaderBar');
            var percent = document.getElementById('loaderPercent');
            var statusText = document.getElementById('statusText');

            var messages = [
                { icon: '⚙️', text: 'آماده‌سازی سیستم...' },
                { icon: '🎨', text: 'بارگذاری آیکون‌ها...' },
                { icon: '🎮', text: 'آماده‌سازی بازی‌ها...' },
                { icon: '🐍', text: 'بارگذاری مار و پله...' },
                { icon: '🏎️', text: 'بارگذاری مسابقه سرعت...' },
                { icon: '💣', text: 'بارگذاری بوم بوم...' },
                { icon: '⛏️', text: 'بارگذاری ماینکرفت...' },
                { icon: '💰', text: 'به‌روزرسانی سکه‌ها...' },
                { icon: '🏆', text: 'آماده‌سازی فروشگاه...' },
                { icon: '✨', text: 'به زودی شروع می‌شود...' },
                { icon: '🚀', text: 'ورود به بازی...' }
            ];

            function updateLoader() {
                if (progress < 100) {
                    var step = Math.floor(Math.random() * 5) + 2;
                    progress = Math.min(progress + step, 100);

                    bar.style.width = progress + '%';
                    percent.textContent = progress;

                    var msgIndex = Math.min(Math.floor(progress / 10), messages.length - 1);
                    var msg = messages[msgIndex];
                    statusText.innerHTML = '<span class="status-icon">' + msg.icon + '</span>' + msg.text;

                    var delay = Math.floor(Math.random() * 100) + 80;
                    setTimeout(updateLoader, delay);
                } else {
                    statusText.innerHTML = '<span class="status-icon">✅</span> آماده! ورود به بازی...';
                    bar.style.width = '100%';
                    percent.textContent = '100';

                    setTimeout(function() {
                        window.location.href = 'home.html';
                    }, 1000);
                }
            }

            setTimeout(updateLoader, 300);
        })();
    </script>

</body>
</html>
