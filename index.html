<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarLoom_Game - در حال بارگذاری...</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شفق پس‌زمینه -->
    <div class="aurora"></div>

    <!-- کانتینر لودینگ -->
    <div class="loading-container">
        <!-- لوگو با ستاره‌های چرخان -->
        <div class="logo-wrapper">
            <div class="stars-orbit">
                <span>✦</span>
                <span>✧</span>
                <span>✦</span>
                <span>✧</span>
            </div>
            <div class="logo">StarLoom<span>_Game</span></div>
        </div>

        <div class="logo-sub">✦ در حال بارگذاری ✦</div>

        <!-- نوار بارگذاری -->
        <div class="loader-wrapper">
            <div class="loader-track">
                <div class="loader-bar" id="loaderBar"></div>
            </div>
            <div class="loader-text">
                <span class="loader-percent" id="loaderPercent">0</span>%
                <span class="dots">
                    <span>.</span><span>.</span><span>.</span>
                </span>
                <div class="status-text" id="statusText">
                    <span class="status-icon">⚙️</span>
                    آماده‌سازی...
                </div>
            </div>
        </div>

        <!-- کارت‌های در حال بارگذاری -->
        <div class="loading-cards">
            <div class="loading-card">
                <span class="card-icon">🐍</span>
                <span>مار و پله</span>
            </div>
            <div class="loading-card">
                <span class="card-icon">🏎️</span>
                <span>مسابقه سرعت</span>
            </div>
            <div class="loading-card">
                <span class="card-icon">💣</span>
                <span>بوم بوم</span>
            </div>
            <div class="loading-card">
                <span class="card-icon">⛏️</span>
                <span>ماینکرفت</span>
            </div>
        </div>
    </div>

    <div class="version">v2.0</div>

    <script>
        (function(){
            var progress = 0;
            var bar = document.getElementById('loaderBar');
            var percent = document.getElementById('loaderPercent');
            var statusText = document.getElementById('statusText');

            var messages = [
                { icon: '⚙️', text: 'آماده‌سازی سیستم...' },
                { icon: '🎨', text: 'بارگذاری آیکون‌ها...' },
                { icon: '🎮', text: 'آماده‌سازی بازی‌ها...' },
                { icon: '🐍', text: 'بارگذاری مار و پله...' },
                { icon: '🏎️', text: 'بارگذاری مسابقه سرعت...' },
                { icon: '💣', text: 'بارگذاری بوم بوم...' },
                { icon: '⛏️', text: 'بارگذاری ماینکرفت...' },
                { icon: '💰', text: 'به‌روزرسانی سکه‌ها...' },
                { icon: '🏆', text: 'آماده‌سازی فروشگاه...' },
                { icon: '✨', text: 'به زودی شروع می‌شود...' },
                { icon: '🚀', text: 'ورود به بازی...' }
            ];

            function updateLoader() {
                if (progress < 100) {
                    var step = Math.floor(Math.random() * 5) + 2;
                    progress = Math.min(progress + step, 100);

                    bar.style.width = progress + '%';
                    percent.textContent = progress;

                    var msgIndex = Math.min(Math.floor(progress / 10), messages.length - 1);
                    var msg = messages[msgIndex];
                    statusText.innerHTML = '<span class="status-icon">' + msg.icon + '</span>' + msg.text;

                    var delay = Math.floor(Math.random() * 100) + 80;
                    setTimeout(updateLoader, delay);
                } else {
                    statusText.innerHTML = '<span class="status-icon">✅</span> آماده! ورود به بازی...';
                    bar.style.width = '100%';
                    percent.textContent = '100';

                    setTimeout(function() {
                        window.location.href = 'home.html';
                    }, 1000);
                }
            }

            setTimeout(updateLoader, 300);
        })();
    </script>

</body>
</html>
