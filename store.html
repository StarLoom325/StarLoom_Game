<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⭐ StarLoom - فروشگاه</title>
<meta name="description" content="فروشگاه StarLoom">
<link rel="stylesheet" href="style.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: linear-gradient(135deg, #0b0e1a 0%, #1a1f30 100%);
  min-height: 100vh;
  color: #f0f4ff;
  padding: 15px;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  background-image:
    radial-gradient(circle, rgba(255,255,255,.6) 1px, transparent 1px),
    radial-gradient(circle, rgba(32,220,255,.3) 1px, transparent 1px);
  background-size: 100px 100px, 180px 180px;
  animation: starField 40s linear infinite;
  opacity: .3;
}
@keyframes starField {
  from { transform: translateY(0); }
  to { transform: translateY(100px); }
}

.main-container {
  max-width: 1250px;
  margin: 0 auto;
}

.header {
  position: relative;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 25px;
  background: linear-gradient(135deg, rgba(18,25,53,.85), rgba(7,11,27,.8));
  border-radius: 24px;
  border: 1px solid rgba(120,150,255,.18);
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 25px;
  box-shadow: 0 20px 60px rgba(0,0,0,.35);
  backdrop-filter: blur(20px);
}
.header::before {
  content: "";
  position: absolute;
  top: -1px;
  left: 12%;
  right: 12%;
  height: 1px;
  background: linear-gradient(90deg, transparent, #20dcff, #a66cff, transparent);
  box-shadow: 0 0 18px #20dcff, 0 0 30px #a66cff;
  opacity: .7;
}

.logo {
  font-size: 1.6rem;
  font-weight: 900;
  letter-spacing: .5px;
  background: linear-gradient(90deg, #fff, #8feeff, #a779ff, #fff);
  background-size: 250% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: logoFlow 5s linear infinite;
}
@keyframes logoFlow {
  to { background-position: 250% center; }
}
.logo span {
  color: #7885a8;
  font-size: 13px;
  font-weight: 500;
  -webkit-text-fill-color: #7885a8;
}

.back-home {
  background: #2d3852;
  border: 1px solid #5a6a8a;
  padding: 10px 25px;
  border-radius: 50px;
  color: #f0f4ff;
  font-weight: 600;
  cursor: pointer;
  font-size: 0.95rem;
  text-decoration: none;
  display: inline-block;
  transition: all 0.2s;
}
.back-home:hover {
  background: #3f4d70;
  border-color: #f1c40f;
  transform: translateY(-2px);
}

.empty-state {
  text-align: center;
  padding: 100px 20px;
  color: #8491b5;
}

.empty-icon {
  font-size: 6rem;
  margin-bottom: 25px;
  opacity: 0.4;
  animation: emptyFloat 3s ease-in-out infinite alternate;
}
@keyframes emptyFloat {
  from { transform: translateY(0); }
  to { transform: translateY(-15px); }
}

.empty-title {
  font-size: 1.6rem;
  font-weight: 800;
  color: #f0f4ff;
  margin-bottom: 12px;
  background: linear-gradient(90deg, #20dcff, #a66cff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.empty-text {
  font-size: 0.95rem;
  color: #8491b5;
  line-height: 1.8;
  max-width: 500px;
  margin-left: auto;
  margin-right: auto;
}

.footer {
  text-align: center;
  margin-top: 50px;
  padding: 25px 0;
  color: #4f5b7b;
  font-size: 0.8rem;
  border-top: 1px solid rgba(120,150,255,.08);
  letter-spacing: .5px;
}
.footer p::first-letter { color: #20dcff; }

@media (max-width: 700px) {
  .logo { font-size: 1.2rem; }
  .logo span { font-size: 10px; }
  .empty-icon { font-size: 4rem; }
  .empty-title { font-size: 1.3rem; }
  .empty-text { font-size: 0.85rem; }
  .header { padding: 15px; }
}
</style>
</head>
<body>

<div class="main-container">

<div class="header">
  <div class="logo">⭐ StarLoom <span>| فروشگاه</span></div>
  <a href="home.html" class="back-home">← بازگشت</a>
</div>

<div class="empty-state">
  <div class="empty-icon">📦</div>
  <div class="empty-title">فروشگاه خالیه!</div>
  <div class="empty-text">
    هنوز هیچ برنامه یا بازی‌ای اضافه نشده.<br>
    به‌زودی محتوا اضافه می‌شه!
  </div>
</div>

<div class="footer">
  <p>✦ StarLoom_Game — فروشگاه | تمامی حقوق محفوظ است | v1.0</p>
</div>

</div>

</body>
</html>
