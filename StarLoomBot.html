<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StarLoomBot | ربات راهنمای StarLoom</title>

    <meta
        name="description"
        content="StarLoomBot - دستیار و راهنمای دنیای StarLoom_Game"
    >

    <style>

        /* =====================================================
           STARLOOM BOT
           طراحی اختصاصی StarLoom
           ===================================================== */

        :root{
            --bg:#03050d;
            --bg2:#080c1c;

            --panel:rgba(10,16,37,.78);
            --panel-light:rgba(255,255,255,.045);

            --cyan:#20dcff;
            --blue:#6578ff;
            --purple:#a66cff;
            --gold:#f1c75b;

            --text:#eef6ff;
            --muted:#8190b5;

            --border:rgba(120,150,255,.18);

            --bot-gradient:
                linear-gradient(
                    135deg,
                    #20dcff,
                    #6578ff,
                    #a66cff
                );

            --shadow:
                0 25px 80px rgba(0,0,0,.55);
        }


        /* =====================================================
           RESET
           ===================================================== */

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }


        html,
        body{
            width:100%;
            min-height:100%;
        }


        body{
            min-height:100vh;

            font-family:
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;

            color:var(--text);

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(104,76,255,.25),
                    transparent 38%
                ),
                radial-gradient(
                    circle at 5% 70%,
                    rgba(32,220,255,.09),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 95% 80%,
                    rgba(166,108,255,.1),
                    transparent 30%
                ),
                linear-gradient(
                    145deg,
                    #02030a,
                    #070b19 50%,
                    #03050d
                );

            display:flex;
            align-items:center;
            justify-content:center;

            padding:18px;

            overflow:hidden;
        }


        /* =====================================================
           STAR FIELD
           ===================================================== */

        body::before{
            content:"";

            position:fixed;
            inset:0;

            pointer-events:none;

            background-image:
                radial-gradient(
                    circle,
                    rgba(255,255,255,.75) 1px,
                    transparent 1px
                ),
                radial-gradient(
                    circle,
                    rgba(32,220,255,.45) 1px,
                    transparent 1px
                ),
                radial-gradient(
                    circle,
                    rgba(166,108,255,.35) 1px,
                    transparent 1px
                );

            background-size:
                85px 85px,
                145px 145px,
                210px 210px;

            opacity:.3;

            animation:
                starsMove
                35s
                linear
                infinite;
        }


        @keyframes starsMove{

            from{
                transform:translateY(0);
            }

            to{
                transform:translateY(100px);
            }

        }


        /* =====================================================
           AURORA
           ===================================================== */

        .aurora{
            position:fixed;
            inset:0;

            pointer-events:none;

            overflow:hidden;

            z-index:-1;
        }


        .aurora::before{
            content:"";

            position:absolute;

            width:650px;
            height:650px;

            top:-380px;
            left:50%;

            transform:translateX(-50%);

            border-radius:50%;

            background:
                radial-gradient(
                    circle,
                    rgba(101,120,255,.22),
                    transparent 68%
                );

            filter:blur(20px);

            animation:
                auroraPulse
                7s
                ease-in-out
                infinite
                alternate;
        }


        .aurora::after{
            content:"";

            position:absolute;

            width:500px;
            height:500px;

            bottom:-280px;
            right:-160px;

            border-radius:50%;

            background:
                radial-gradient(
                    circle,
                    rgba(32,220,255,.09),
                    transparent 70%
                );

            filter:blur(25px);

            animation:
                auroraMove
                10s
                ease-in-out
                infinite
                alternate;
        }


        @keyframes auroraPulse{

            from{
                transform:
                    translateX(-50%)
                    scale(.9);
                opacity:.6;
            }

            to{
                transform:
                    translateX(-50%)
                    scale(1.12);
                opacity:1;
            }

        }


        @keyframes auroraMove{

            from{
                transform:translate(0,0);
            }

            to{
                transform:translate(-80px,-50px);
            }

        }


        /* =====================================================
           BOT CONTAINER
           ===================================================== */

        .bot-container{

            position:relative;

            width:100%;
            max-width:650px;

            height:92vh;
            max-height:850px;

            display:flex;
            flex-direction:column;

            overflow:hidden;

            border-radius:30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(13,20,45,.88),
                    rgba(5,9,23,.88)
                );

            border:1px solid var(--border);

            box-shadow:
                var(--shadow),
                inset 0 1px rgba(255,255,255,.045);

            backdrop-filter:blur(22px);

            animation:
                containerIn
                .55s
                ease;
        }


        @keyframes containerIn{

            from{
                opacity:0;
                transform:
                    translateY(20px)
                    scale(.97);
            }

            to{
                opacity:1;
                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* نور بالای پنجره */

        .bot-container::before{

            content:"";

            position:absolute;

            top:0;
            left:12%;
            right:12%;

            height:1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--cyan),
                    var(--purple),
                    transparent
                );

            box-shadow:
                0 0 18px var(--cyan),
                0 0 35px var(--purple);

            z-index:10;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        .bot-header{

            position:relative;

            min-height:82px;

            padding:14px 20px;

            display:flex;
            align-items:center;

            gap:13px;

            background:
                linear-gradient(
                    135deg,
                    rgba(32,220,255,.07),
                    rgba(166,108,255,.08),
                    rgba(255,255,255,.015)
                );

            border-bottom:
                1px solid
                rgba(120,150,255,.13);

            flex-shrink:0;
        }


        /* =====================================================
           BOT AVATAR
           ===================================================== */

        .bot-avatar{

            position:relative;

            width:54px;
            height:54px;

            display:flex;
            align-items:center;
            justify-content:center;

            border-radius:17px;

            background:
                radial-gradient(
                    circle at 30% 20%,
                    rgba(255,255,255,.25),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #20dcff,
                    #6578ff,
                    #a66cff
                );

            border:
                1px solid
                rgba(255,255,255,.2);

            font-size:28px;

            box-shadow:
                0 0 25px rgba(32,220,255,.18),
                0 0 35px rgba(166,108,255,.1);

            animation:
                botFloat
                3s
                ease-in-out
                infinite;
        }


        .bot-avatar::after{

            content:"";

            position:absolute;

            inset:-5px;

            border-radius:20px;

            border:
                1px solid
                rgba(32,220,255,.18);

            opacity:.7;

            animation:
                avatarRing
                2.5s
                linear
                infinite;
        }


        @keyframes botFloat{

            0%,
            100%{
                transform:translateY(0);
            }

            50%{
                transform:translateY(-3px);
            }

        }


        @keyframes avatarRing{

            from{
                transform:rotate(0deg);
                opacity:.2;
            }

            50%{
                opacity:.7;
            }

            to{
                transform:rotate(360deg);
                opacity:.2;
            }

        }


        /* =====================================================
           BOT INFO
           ===================================================== */

        .bot-info{
            min-width:0;
        }


        .bot-info h3{

            font-size:18px;

            font-weight:900;

            margin-bottom:3px;

            background:
                linear-gradient(
                    90deg,
                    #fff,
                    #8ceeff,
                    #b17cff
                );

            -webkit-background-clip:text;
            background-clip:text;

            color:transparent;
        }


        .bot-info p{

            display:flex;
            align-items:center;

            gap:6px;

            color:#43e99a;

            font-size:11px;
        }


        .bot-info p::before{

            content:"";

            width:7px;
            height:7px;

            border-radius:50%;

            background:#35e69a;

            box-shadow:
                0 0 10px #35e69a;

            animation:
                onlineDot
                1.5s
                ease-in-out
                infinite;
        }


        @keyframes onlineDot{

            0%,
            100%{
                opacity:1;
                transform:scale(1);
            }

            50%{
                opacity:.35;
                transform:scale(.75);
            }

        }


        /* عنوان کوچک سمت راست */

        .bot-header-label{

            margin-right:auto;

            color:#647394;

            font-size:9px;

            letter-spacing:1px;

            padding:7px 10px;

            border-radius:10px;

            border:
                1px solid
                rgba(120,150,255,.12);

            background:
                rgba(255,255,255,.025);
        }


        /* =====================================================
           MESSAGES AREA
           ===================================================== */

        .messages-area{

            flex:1;

            min-height:0;

            padding:20px;

            overflow-y:auto;

            display:flex;

            flex-direction:column;

            gap:13px;

            scroll-behavior:smooth;
        }


        .messages-area::-webkit-scrollbar{
            width:6px;
        }


        .messages-area::-webkit-scrollbar-track{

            background:
                rgba(0,0,0,.15);

            border-radius:10px;
        }


        .messages-area::-webkit-scrollbar-thumb{

            background:
                linear-gradient(
                    var(--cyan),
                    var(--purple)
                );

            border-radius:10px;
        }


        /* =====================================================
           MESSAGE
           ===================================================== */

        .message{

            max-width:88%;

            display:flex;

            gap:9px;

            animation:
                messageIn
                .35s
                ease;
        }


        @keyframes messageIn{

            from{
                opacity:0;
                transform:translateY(9px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }


        .message.bot{
            align-self:flex-start;
        }


        .message.user{

            align-self:flex-end;

            flex-direction:row-reverse;
        }


        /* =====================================================
           MESSAGE AVATAR
           ===================================================== */

        .message-avatar{

            width:36px;
            height:36px;

            flex-shrink:0;

            display:flex;
            align-items:center;
            justify-content:center;

            border-radius:12px;

            background:
                linear-gradient(
                    135deg,
                    #20dcff,
                    #6578ff,
                    #a66cff
                );

            border:
                1px solid
                rgba(255,255,255,.12);

            font-size:19px;

            box-shadow:
                0 6px 18px
                rgba(0,0,0,.25);
        }


        .message.user .message-avatar{

            background:
                linear-gradient(
                    135deg,
                    #667cff,
                    #a66cff
                );

        }


        /* =====================================================
           MESSAGE BUBBLE
           ===================================================== */

        .message-bubble{

            position:relative;

            padding:12px 16px;

            border-radius:
                18px
                18px
                18px
                6px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.055),
                    rgba(255,255,255,.018)
                );

            border:
                1px solid
                rgba(120,150,255,.16);

            color:#dce7fa;

            font-size:14px;

            line-height:1.8;

            box-shadow:
                0 7px 25px
                rgba(0,0,0,.15);
        }


        .message.user .message-bubble{

            border-radius:
                18px
                18px
                6px
                18px;

            background:
                linear-gradient(
                    135deg,
                    #6578ff,
                    #8b62ed
                );

            border-color:
                rgba(160,180,255,.3);

            color:#fff;

            box-shadow:
                0 8px 25px
                rgba(80,90,255,.18);
        }


        .message-bubble strong{

            color:
                #68eaff;
        }


        .message.user
        .message-bubble strong{

            color:#fff;
        }


        /* =====================================================
           TYPING
           ===================================================== */

        .typing-indicator{

            display:inline-flex;

            align-items:center;

            gap:5px;

            padding:5px 2px;
        }


        .typing-indicator span{

            width:7px;
            height:7px;

            border-radius:50%;

            background:
                var(--cyan);

            box-shadow:
                0 0 8px
                rgba(32,220,255,.5);

            animation:
                typing
                1.3s
                ease-in-out
                infinite;
        }


        .typing-indicator span:nth-child(2){
            animation-delay:.18s;
        }


        .typing-indicator span:nth-child(3){
            animation-delay:.36s;
        }


        @keyframes typing{

            0%,
            60%,
            100%{
                transform:translateY(0);
                opacity:.3;
            }

            30%{
                transform:translateY(-7px);
                opacity:1;
            }

        }


        /* =====================================================
           OPTIONS AREA
           ===================================================== */

        .options-area{

            flex-shrink:0;

            padding:14px 18px 18px;

            display:flex;

            flex-direction:column;

            gap:9px;

            max-height:43%;

            overflow-y:auto;

            border-top:
                1px solid
                rgba(120,150,255,.1);

            background:
                linear-gradient(
                    180deg,
                    rgba(0,0,0,.13),
                    rgba(0,0,0,.23)
                );
        }


        .options-area::-webkit-scrollbar{
            width:4px;
        }


        .options-area::-webkit-scrollbar-thumb{

            background:
                linear-gradient(
                    var(--cyan),
                    var(--purple)
                );

            border-radius:10px;
        }


        /* =====================================================
           OPTION BUTTON
           ===================================================== */

        .option-btn{

            position:relative;

            width:100%;

            padding:13px 16px;

            border-radius:15px;

            border:
                1px solid
                rgba(120,150,255,.17);

            background:
                linear-gradient(
                    135deg,
                    rgba(32,220,255,.055),
                    rgba(166,108,255,.055)
                );

            color:#e7efff;

            font-family:inherit;

            font-size:13px;

            font-weight:700;

            cursor:pointer;

            text-align:right;

            display:flex;

            align-items:center;

            gap:10px;

            transition:
                transform .25s,
                border-color .25s,
                background .25s,
                box-shadow .25s;
        }


        .option-btn::before{

            content:"";

            position:absolute;

            top:0;
            bottom:0;
            right:0;

            width:3px;

            border-radius:
                0
                15px
                15px
                0;

            background:
                linear-gradient(
                    var(--cyan),
                    var(--purple)
                );

            opacity:0;

            transition:.25s;
        }


        .option-btn:hover{

            transform:
                translateX(-5px);

            border-color:
                rgba(32,220,255,.4);

            background:
                linear-gradient(
                    135deg,
                    rgba(32,220,255,.11),
                    rgba(166,108,255,.11)
                );

            box-shadow:
                0 8px 25px
                rgba(32,220,255,.08);
        }


        .option-btn:hover::before{
            opacity:1;
        }


        .option-btn:active{
            transform:scale(.985);
        }


        .option-icon{

            width:32px;
            height:32px;

            display:flex;
            align-items:center;
            justify-content:center;

            flex-shrink:0;

            border-radius:10px;

            background:
                rgba(255,255,255,.045);

            border:
                1px solid
                rgba(120,150,255,.1);

            font-size:18px;
        }


        /* =====================================================
           FOOTER
           ===================================================== */

        .bot-footer{

            display:flex;

            align-items:center;

            justify-content:center;

            gap:8px;

            padding:7px;

            color:#465474;

            font-size:8px;

            border-top:
                1px solid
                rgba(120,150,255,.06);

            background:
                rgba(0,0,0,.12);
        }


        .bot-footer span{
            color:#6a7a9d;
        }


        /* =====================================================
           HOME BUTTON
           ===================================================== */

        .home-button{

            position:absolute;

            top:14px;
            left:16px;

            z-index:20;

            display:flex;
            align-items:center;

            gap:5px;

            padding:7px 10px;

            border-radius:10px;

            color:#9aabd0;

            text-decoration:none;

            font-size:10px;

            border:
                1px solid
                rgba(120,150,255,.14);

            background:
                rgba(0,0,0,.16);

            transition:.25s;
        }


        .home-button:hover{

            color:#fff;

            border-color:
                rgba(32,220,255,.4);

            background:
                rgba(32,220,255,.07);

            transform:translateY(-2px);
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media(max-width:600px){

            body{
                padding:0;
            }


            .bot-container{

                width:100%;
                height:100vh;
                max-height:none;

                border-radius:0;

                border-left:0;
                border-right:0;
            }


            .bot-header{

                min-height:76px;

                padding:
                    12px
                    15px;
            }


            .bot-avatar{

                width:48px;
                height:48px;

                border-radius:15px;

                font-size:25px;
            }


            .bot-info h3{
                font-size:16px;
            }


            .bot-header-label{
                display:none;
            }


            .home-button{

                top:12px;
                left:12px;
            }


            .messages-area{

                padding:
                    15px 12px;
            }


            .message{
                max-width:92%;
            }


            .message-bubble{

                font-size:13px;

                padding:
                    10px 13px;
            }


            .message-avatar{

                width:33px;
                height:33px;

                border-radius:10px;

                font-size:17px;
            }


            .options-area{

                padding:
                    10px
                    11px
                    12px;

                max-height:45%;
            }


            .option-btn{

                padding:
                    11px
                    13px;

                font-size:12px;
            }


            .option-icon{

                width:29px;
                height:29px;

                font-size:16px;
            }

        }


        /* =====================================================
           SMALL PHONE
           ===================================================== */

        @media(max-width:380px){

            .message-bubble{
                font-size:12px;
                line-height:1.7;
            }


            .option-btn{
                font-size:11px;
            }


            .bot-footer{
                display:none;
            }

        }


        /* =====================================================
           REDUCED MOTION
           ===================================================== */

        @media(prefers-reduced-motion:reduce){

            *,
            *::before,
            *::after{

                animation-duration:
                    .01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    .01ms !important;
            }

        }

    </style>
</head>


<body>

    <!-- =====================================================
         پس‌زمینه
         ===================================================== -->

    <div class="aurora"></div>


    <!-- =====================================================
         ربات
         ===================================================== -->

    <div class="bot-container">


        <!-- بازگشت به خانه -->

        <a
            href="home.html"
            class="home-button"
            title="بازگشت به صفحه اصلی">

            🏠 خانه

        </a>


        <!-- =================================================
             HEADER
             ================================================= -->

        <div class="bot-header">

            <div class="bot-avatar">
                🤖
            </div>


            <div class="bot-info">

                <h3>
                    StarLoomBot
                </h3>

                <p>
                    آنلاین
                </p>

            </div>


            <div class="bot-header-label">
                STARLOOM AI GUIDE
            </div>

        </div>


        <!-- =================================================
             MESSAGES
             ================================================= -->

        <div
            class="messages-area"
            id="messagesArea">
        </div>


        <!-- =================================================
             OPTIONS
             ================================================= -->

        <div
            class="options-area"
            id="optionsArea">
        </div>


        <!-- =================================================
             FOOTER
             ================================================= -->

        <div class="bot-footer">

            <span>✦</span>

            StarLoom_Game

            <span>•</span>

            StarLoomBot

            <span>•</span>

            راهنمای بازی‌ها

            <span>✦</span>

        </div>

    </div>


    <script>

        (function(){

            /* =================================================
               ELEMENTS
               ================================================= */

            var messagesArea =
                document.getElementById(
                    'messagesArea'
                );

            var optionsArea =
                document.getElementById(
                    'optionsArea'
                );


            /* =================================================
               SCROLL
               ================================================= */

            function scrollToBottom(){

                setTimeout(
                    function(){

                        messagesArea.scrollTop =
                            messagesArea.scrollHeight;

                    },
                    100
                );

            }


            /* =================================================
               ADD MESSAGE
               ================================================= */

            function addMessage(
                text,
                sender
            ){

                var msgDiv =
                    document.createElement(
                        'div'
                    );

                msgDiv.className =
                    'message ' +
                    sender;


                var avatar =
                    document.createElement(
                        'div'
                    );

                avatar.className =
                    'message-avatar';

                avatar.textContent =
                    sender === 'bot'
                    ?
                    '🤖'
                    :
                    '👤';


                var bubble =
                    document.createElement(
                        'div'
                    );

                bubble.className =
                    'message-bubble';

                bubble.innerHTML =
                    text;


                msgDiv.appendChild(
                    avatar
                );

                msgDiv.appendChild(
                    bubble
                );

                messagesArea.appendChild(
                    msgDiv
                );


                scrollToBottom();

            }


            /* =================================================
               TYPING
               ================================================= */

            function addTyping(){

                var typingDiv =
                    document.createElement(
                        'div'
                    );

                typingDiv.className =
                    'message bot';

                typingDiv.id =
                    'typingIndicator';


                var avatar =
                    document.createElement(
                        'div'
                    );

                avatar.className =
                    'message-avatar';

                avatar.textContent =
                    '🤖';


                var bubble =
                    document.createElement(
                        'div'
                    );

                bubble.className =
                    'message-bubble';


                bubble.innerHTML =
                    '<div class="typing-indicator">' +
                    '<span></span>' +
                    '<span></span>' +
                    '<span></span>' +
                    '</div>';


                typingDiv.appendChild(
                    avatar
                );

                typingDiv.appendChild(
                    bubble
                );

                messagesArea.appendChild(
                    typingDiv
                );


                scrollToBottom();

            }


            function removeTyping(){

                var typing =
                    document.getElementById(
                        'typingIndicator'
                    );

                if(typing)
                    typing.remove();

            }


            /* =================================================
               BOT SAY
               ================================================= */

            function botSay(
                text,
                callback,
                delay
            ){

                delay =
                    delay ||
                    800;


                addTyping();


                setTimeout(
                    function(){

                        removeTyping();

                        addMessage(
                            text,
                            'bot'
                        );


                        if(callback)
                            callback();

                    },
                    delay
                );

            }


            /* =================================================
               OPTIONS
               ================================================= */

            function showOptions(
                options
            ){

                optionsArea.innerHTML =
                    '';


                options.forEach(
                    function(opt){

                        var btn =
                            document.createElement(
                                'button'
                            );

                        btn.className =
                            'option-btn';


                        btn.innerHTML =
                            '<span class="option-icon">' +
                            opt.icon +
                            '</span>' +

                            '<span>' +
                            opt.text +
                            '</span>';


                        btn.addEventListener(
                            'click',
                            function(){

                                handleOption(
                                    opt
                                );

                            }
                        );


                        optionsArea.appendChild(
                            btn
                        );

                    }
                );

            }


            function clearOptions(){

                optionsArea.innerHTML =
                    '';

            }

            function scenarioPlay(){

                    function(){

            /* =================================================
               NAVIGATION
               ================================================= */

            function goToPage(
                page,
                message
            ){

                botSay(
                    message,
                    function(){

                        setTimeout(
                            function(){

                                window.location.href =
                                    page;

                            },
                            800
                        );

                    },
                    650
                );

            }


            /* =================================================
               HANDLE OPTION
               ================================================= */

            function handleOption(
                opt
            ){

                addMessage(
                    opt.text,
                    'user'
                );


                clearOptions();


                setTimeout(
                    function(){

                        switch(
                            opt.action
                        ){

                            case 'start':

                                scenarioStart();

                                break;


                            case 'about':

                                scenarioAbout();

                                break;


                            case 'tutorial':

                                scenarioTutorial();

                                break;


                            case 'play':

                                scenarioPlay();

                                break;


                            case 'home':

                                goToPage(
                                    'home.html',
                                    '🏠 عالیه! در حال رفتن به <strong>صفحه اصلی StarLoom</strong>...'
                                );

                                break;


                            case 'snake':

                                goToPage(
                                    'snake.html',
                                    '🐍 عالیه! در حال ورود به <strong>مار و پله</strong>...'
                                );

                                break;


                            case 'minecraft':

                                    'minecraft.html',
                                    '⛏️ عالیه! در حال ورود به <strong>ماینکرفت</strong>...'
                                );

                                break;

                                );

                                break;


                            default:

                                scenarioStart();

                                break;

                        }

                    },
                    350
                );

            }

               START
               ================================================= */

                scenarioStart,
                500
            );


            console.log(

            );

                '✦ StarLoom AI Guide'
            );
