<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarLoomBot - ربات راهنما</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
            background:linear-gradient(135deg,#0b0e1a 0%,#1a1f30 100%);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:15px;
            overflow:hidden;
        }

        /* شفق پس‌زمینه */
        .aurora{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;overflow:hidden;pointer-events:none}
        .aurora::before,.aurora::after{content:'';position:absolute;width:200%;height:200%;top:-50%;left:-50%;background:radial-gradient(ellipse at 30% 50%,rgba(241,196,15,0.05) 0%,transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(231,76,60,0.04) 0%,transparent 50%);animation:auroraFloat 20s ease-in-out infinite alternate}
        .aurora::after{animation-delay:-10s;background:radial-gradient(ellipse at 60% 40%,rgba(52,152,219,0.04) 0%,transparent 50%)}
        @keyframes auroraFloat{0%{transform:translate(0,0) scale(1)}100%{transform:translate(3%,-3%) scale(1.01)}}

        /* کانتینر اصلی */
        .bot-container{
            width:100%;
            max-width:600px;
            height:90vh;
            max-height:800px;
            background:rgba(255,255,255,0.05);
            border-radius:30px;
            border:1px solid rgba(255,215,0,0.15);
            backdrop-filter:blur(10px);
            display:flex;
            flex-direction:column;
            overflow:hidden;
            box-shadow:0 20px 60px rgba(0,0,0,0.5);
            animation:fadeIn 0.5s ease;
        }
        @keyframes fadeIn{0%{opacity:0;transform:scale(0.9)}100%{opacity:1;transform:scale(1)}}

        /* هدر ربات */
        .bot-header{
            padding:18px 25px;
            background:linear-gradient(135deg,rgba(241,196,15,0.15),rgba(243,156,18,0.05));
            border-bottom:1px solid rgba(241,196,15,0.2);
            display:flex;
            align-items:center;
            gap:12px;
        }
        .bot-avatar{
            width:50px;
            height:50px;
            border-radius:50%;
            background:linear-gradient(135deg,#f9d976,#f39c12);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:1.8rem;
            box-shadow:0 0 20px rgba(243,156,18,0.4);
            animation:pulse 2s ease-in-out infinite;
        }
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
        .bot-info h3{color:#f5e9c4;font-size:1.1rem;margin-bottom:2px}
        .bot-info p{color:#2ecc71;font-size:0.75rem;display:flex;align-items:center;gap:5px}
        .bot-info p::before{content:'';width:8px;height:8px;background:#2ecc71;border-radius:50%;animation:dot 1.5s ease-in-out infinite}
        @keyframes dot{0%,100%{opacity:1}50%{opacity:0.3}}

        /* ناحیه پیام‌ها */
        .messages-area{
            flex:1;
            padding:20px;
            overflow-y:auto;
            display:flex;
            flex-direction:column;
            gap:12px;
            scroll-behavior:smooth;
        }
        .messages-area::-webkit-scrollbar{width:6px}
        .messages-area::-webkit-scrollbar-track{background:rgba(0,0,0,0.2);border-radius:10px}
        .messages-area::-webkit-scrollbar-thumb{background:#f1c40f;border-radius:10px}

        /* پیام ربات */
        .message{
            max-width:85%;
            display:flex;
            gap:10px;
            animation:messageIn 0.4s ease;
        }
        @keyframes messageIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}

        .message.bot{align-self:flex-start}
        .message.user{align-self:flex-end;flex-direction:row-reverse}

        .message-avatar{
            width:38px;
            height:38px;
            border-radius:50%;
            background:linear-gradient(135deg,#f9d976,#f39c12);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:1.3rem;
            flex-shrink:0;
        }
        .message.user .message-avatar{
            background:linear-gradient(135deg,#5dade2,#3498db);
        }

        .message-bubble{
            padding:12px 16px;
            border-radius:18px;
            background:rgba(255,255,255,0.06);
            border:1px solid rgba(255,215,0,0.15);
            color:#f0f4ff;
            font-size:0.95rem;
            line-height:1.6;
            position:relative;
        }
        .message.user .message-bubble{
            background:linear-gradient(135deg,#f1c40f,#d4a800);
            color:#1a1f30;
            border-color:#f1c40f;
        }
        .message-bubble strong{color:#f1c40f}
        .message.user .message-bubble strong{color:#1a1f30}

        /* تایپینگ */
        .typing-indicator{
            display:inline-flex;
            gap:4px;
            padding:8px 0;
        }
        .typing-indicator span{
            width:8px;
            height:8px;
            border-radius:50%;
            background:#f1c40f;
            animation:typing 1.4s ease-in-out infinite;
        }
        .typing-indicator span:nth-child(2){animation-delay:0.2s}
        .typing-indicator span:nth-child(3){animation-delay:0.4s}
        @keyframes typing{0%,60%,100%{transform:translateY(0);opacity:0.3}30%{transform:translateY(-8px);opacity:1}}

        /* دکمه‌های گزینه */
        .options-area{
            padding:15px 20px;
            display:flex;
            flex-direction:column;
            gap:10px;
            border-top:1px solid rgba(255,215,0,0.1);
            background:rgba(0,0,0,0.2);
            max-height:45%;
            overflow-y:auto;
        }
        .options-area::-webkit-scrollbar{width:4px}
        .options-area::-webkit-scrollbar-thumb{background:#f1c40f;border-radius:10px}

        .option-btn{
            padding:14px 20px;
            border-radius:15px;
            border:1px solid rgba(241,196,15,0.3);
            background:rgba(241,196,15,0.08);
            color:#f0f4ff;
            font-size:0.95rem;
            font-weight:600;
            cursor:pointer;
            transition:all 0.3s;
            text-align:right;
            display:flex;
            align-items:center;
            gap:10px;
            font-family:inherit;
        }
        .option-btn:hover{
            background:rgba(241,196,15,0.15);
            border-color:#f1c40f;
            transform:translateX(-5px);
            box-shadow:0 5px 20px rgba(241,196,15,0.2);
        }
        .option-btn:active{transform:scale(0.98)}
        .option-btn .option-icon{font-size:1.3rem}

        /* واکنش‌گرا */
        @media(max-width:500px){
            .bot-container{height:95vh;border-radius:20px}
            .bot-header{padding:15px 18px}
            .message-bubble{font-size:0.85rem;padding:10px 14px}
            .option-btn{font-size:0.85rem;padding:12px 16px}
        }
    </style>
</head>
<body>

    <!-- شفق پس‌زمینه -->
    <div class="aurora"></div>

    <!-- کانتینر ربات -->
    <div class="bot-container">
        <!-- هدر -->
        <div class="bot-header">
            <div class="bot-avatar">🤖</div>
            <div class="bot-info">
                <h3>StarLoomBot</h3>
                <p>آنلاین</p>
            </div>
        </div>

        <!-- پیام‌ها -->
        <div class="messages-area" id="messagesArea"></div>

        <!-- دکمه‌های گزینه -->
        <div class="options-area" id="optionsArea"></div>
    </div>

    <script>
        (function(){
            // ============================================
            //  المان‌ها
            // ============================================
            var messagesArea = document.getElementById('messagesArea');
            var optionsArea = document.getElementById('optionsArea');

            // ============================================
            //  توابع کمکی
            // ============================================
            function scrollToBottom(){
                setTimeout(function(){
                    messagesArea.scrollTop = messagesArea.scrollHeight;
                }, 100);
            }

            function addMessage(text, sender){
                var msgDiv = document.createElement('div');
                msgDiv.className = 'message ' + sender;

                var avatar = document.createElement('div');
                avatar.className = 'message-avatar';
                avatar.textContent = sender === 'bot' ? '🤖' : '👤';

                var bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                bubble.innerHTML = text;

                msgDiv.appendChild(avatar);
                msgDiv.appendChild(bubble);
                messagesArea.appendChild(msgDiv);
                scrollToBottom();
            }

            function addTyping(){
                var typingDiv = document.createElement('div');
                typingDiv.className = 'message bot';
                typingDiv.id = 'typingIndicator';

                var avatar = document.createElement('div');
                avatar.className = 'message-avatar';
                avatar.textContent = '🤖';

                var bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';

                typingDiv.appendChild(avatar);
                typingDiv.appendChild(bubble);
                messagesArea.appendChild(typingDiv);
                scrollToBottom();
            }

            function removeTyping(){
                var typing = document.getElementById('typingIndicator');
                if(typing) typing.remove();
            }

            function botSay(text, callback, delay){
                delay = delay || 800;
                addTyping();
                setTimeout(function(){
                    removeTyping();
                    addMessage(text, 'bot');
                    if(callback) callback();
                }, delay);
            }

            function showOptions(options){
                optionsArea.innerHTML = '';
                options.forEach(function(opt){
                    var btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = '<span class="option-icon">' + opt.icon + '</span><span>' + opt.text + '</span>';
                    btn.addEventListener('click', function(){
                        handleOption(opt);
                    });
                    optionsArea.appendChild(btn);
                });
            }

            function clearOptions(){
                optionsArea.innerHTML = '';
            }

            // ============================================
            //  سناریوهای ربات
            // ============================================

            // سناریو ۱: شروع
            function scenarioStart(){
                clearOptions();
                botSay('سلام! 👋 خوش اومدی به <strong>StarLoom_Game</strong>!', function(){
                    botSay('من <strong>StarLoomBot</strong> هستم 🤖', function(){
                        botSay('دستیار شخصی و راهنمای تو در دنیای بازی‌های StarLoom!', function(){
                            botSay('خب بگو ببینم، چطور می‌تونم کمکت کنم؟ 😊', function(){
                                showOptions([
                                    { icon: '🎮', text: '🎮 می‌خوام بازی کنم', action: 'play' },
                                    { icon: '📚', text: '📚 آموزش بازی‌ها', action: 'tutorial' },
                                    { icon: '❓', text: '❓ درباره StarLoom_Game بدونم', action: 'about' },
                                    { icon: '🏠', text: '🏠 رفتن به صفحه اصلی', action: 'home' }
                                ]);
                            }, 1200);
                        }, 1000);
                    }, 1200);
                }, 800);
            }

            // سناریو ۲: درباره سایت
            function scenarioAbout(){
                clearOptions();
                botSay('🌟 <strong>StarLoom_Game</strong> چیه؟', function(){
                    botSay('یعنی یه سایت پر از بازی‌های <strong>آنلاین و رایگان</strong> که می‌تونی توش سکه جمع کنی!', function(){
                        botSay('💰 با سکه‌ها می‌تونی <strong>آیکون‌های خاص</strong> بخری و پروفایلت رو خفن کنی!', function(){
                            botSay('🏆 هر بازی جایزه‌های مختلفی داره!', function(){
                                botSay('می‌خوای بیشتر بدونی یا بریم سراغ بازی‌ها؟', function(){
                                    showOptions([
                                        { icon: '🎮', text: '🎮 بریم سراغ بازی‌ها', action: 'play' },
                                        { icon: '📚', text: '📚 آموزش بازی‌ها', action: 'tutorial' },
                                        { icon: '🔙', text: '🔙 برگرد', action: 'start' }
                                    ]);
                                });
                            }, 1000);
                        }, 1200);
                    }, 1000);
                }, 900);
            }

            // سناریو ۳: آموزش بازی‌ها
            function scenarioTutorial(){
                clearOptions();
                botSay('📚 عالیه! بذار همه بازی‌ها رو برات معرفی کنم:', function(){
                    botSay(
                        '<strong>🐍 بازی اول: مار و پله</strong><br>' +
                        '🎯 یه تخته ۲۲۰ خانه‌ای<br>' +
                        '🎲 با تاس باید جلو بری<br>' +
                        '🪜 از نردبان بالا برو<br>' +
                        '🐍 از مارها فرار کن<br>' +
                        '🏆 جایزه: <strong>۸۰۰ سکه + ۱ لول</strong>',
                        function(){
                            botSay(
                                '<strong>⛏️ بازی دوم: ماینکرفت</strong><br>' +
                                '🎯 ۲۰۰۰ بلاک سیاه<br>' +
                                '🔨 با کلنگ بکنشون<br>' +
                                '💎 الماس و ندرایت پیدا کن<br>' +
                                '🏆 جایزه: <strong>۱۳,۰۰۰ سکه</strong>',
                                function(){
                                    botSay(
                                        '<strong>💣 بازی سوم: بوم بوم</strong><br>' +
                                        '🎯 ۱۰۰۰ مکعب جادویی<br>' +
                                        '🪙 سکه، بمب، مار، چکشت<br>' +
                                        '🎁 صندوق‌های جایزه<br>' +
                                        '🏆 جایزه: <strong>۳۰۰۰ سکه</strong>',
                                        function(){
                                            botSay(
                                                '<strong>🏎️ بازی چهارم: مسابقه سرعت</strong><br>' +
                                                '🎯 با کامپیوتر مسابقه بده<br>' +
                                                '⚡ سریع کلیک کن<br>' +
                                                '🚗 ماشین بخر<br>' +
                                                '🏆 جایزه: <strong>۳۰۰ سکه + ۰.۵ لول</strong>',
                                                function(){
                                                    botSay('خب، کدوم بازی رو می‌خوای شروع کنی؟ 🎮', function(){
                                                        showOptions([
                                                            { icon: '🐍', text: '🐍 شروع مار و پله', action: 'snake' },
                                                            { icon: '⛏️', text: '⛏️ شروع ماینکرفت', action: 'minecraft' },
                                                            { icon: '💣', text: '💣 شروع بوم بوم', action: 'boom' },
                                                            { icon: '🏎️', text: '🏎️ شروع مسابقه سرعت', action: 'race' },
                                                            { icon: '⚔️', text: '⚔️ Loom Wars', action: 'loomwars' },
                                                            { icon: '🔙', text: '🔙 برگرد', action: 'start' }
                                                        ]);
                                                    }, 1500);
                                                }, 1500);
                                        }, 1500);
                                }, 1500);
                        }, 1500);
                }, 900);
            }

            // سناریو ۴: انتخاب بازی
            function scenarioPlay(){
                clearOptions();
                botSay('🎮 چه خوب! کدوم بازی رو می‌خوای شروع کنی؟', function(){
                    showOptions([
                        { icon: '🐍', text: '🐍 مار و پله', action: 'snake' },
                        { icon: '⛏️', text: '⛏️ ماینکرفت', action: 'minecraft' },
                        { icon: '💣', text: '💣 بوم بوم', action: 'boom' },
                        { icon: '🏎️', text: '🏎️ مسابقه سرعت', action: 'race' },
                        { icon: '⚔️', text: '⚔️ Loom Wars', action: 'loomwars' },
                        { icon: '🔙', text: '🔙 برگرد', action: 'start' }
                    ]);
                }, 700);
            }

            // ============================================
            //  مدیریت انتخاب کاربر
            // ============================================
            function handleOption(opt){
                // پیام کاربر
                addMessage(opt.text, 'user');
                clearOptions();

                // واکنش ربات
                setTimeout(function(){
                    switch(opt.action){
                        case 'start':
                            scenarioStart();
                            break;
                        case 'about':
                            scenarioAbout();
                            break;
                        case 'tutorial':
                            scenarioTutorial();
                            break;
                        case 'play':
                            scenarioPlay();
                            break;
                        case 'home':
                            botSay('🏠 عالیه! در حال رفتن به صفحه اصلی...', function(){
                                setTimeout(function(){
                                    window.location.href = 'home.html';
                                }, 1000);
                            }, 700);
                            break;
                        case 'snake':
                            botSay('🐍 عالیه! در حال رفتن به <strong>مار و پله</strong>...', function(){
                                setTimeout(function(){
                                    window.location.href = 'snake.html';
                                }, 1000);
                            }, 700);
                            break;
                        case 'minecraft':
                            botSay('⛏️ عالیه! در حال رفتن به <strong>ماینکرفت</strong>...', function(){
                                setTimeout(function(){
                                    window.location.href = 'minecraft.html';
                                }, 1000);
                            }, 700);
                            break;
                        case 'boom':
                            botSay('💣 عالیه! در حال رفتن به <strong>بوم بوم</strong>...', function(){
                                setTimeout(function(){
                                    window.location.href = 'boom.html';
                                }, 1000);
                            }, 700);
                            break;
                        case 'race':
                            botSay('🏎️ عالیه! در حال رفتن به <strong>مسابقه سرعت</strong>...', function(){
                                setTimeout(function(){
                                    window.location.href = 'race.html';
                                }, 1000);
                            }, 700);
                            break;
                            case 'loomwars':
                        botSay('⚔️ عالیه! در حال رفتن به <strong>Loom Wars</strong>...', function(){
                        setTimeout(function(){
                        window.location.href = 'loomwars.html';
                        }, 1000);
                        }, 700);
                        break;
                        default:
                            scenarioStart();
                    }
                }, 500);
            }

            // ============================================
            //  شروع
            // ============================================
            setTimeout(scenarioStart, 500);

            console.log('🤖 StarLoomBot آماده است!');
            console.log('📚 ربات راهنمای StarLoom_Game');

        })();
    </script>
</body>
</html>
